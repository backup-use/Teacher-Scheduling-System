<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makiling IS | My Timetable</title>
    <link rel="icon" type="image/png" href="/shared/img/makiling_logo.png">
    <link rel="stylesheet" href="../css/my-schedule.css?v=1.0.2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Pirata+One&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar" id="app-sidebar">
        <div class="sidebar-top">
            <div class="logo">
                <img src="/shared/img/makiling_logo.png" alt="Makiling IS Logo" width="40" height="40">
                <div class="logo-text">
                    <span class="logo-line-1">Makiling</span>
                    <span class="logo-line-2">Integrated School</span>
                </div>
            </div>
            <button class="sidebar-toggle" id="sidebar-toggle" title="Collapse sidebar">
                <span class="toggle-icon">◀</span>
            </button>
        </div>

        <nav class="nav-links-wrapper">
            <button onclick="window.location.href='index.html'" class="nav-item">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Dashboard Home</span>
            </button>
            <button onclick="window.location.href='my-schedule.html'" class="nav-item active">
                <span class="nav-icon">📅</span>
                <span class="nav-label">My Timetable</span>
            </button>
            <button onclick="window.location.href='rooms-view.html'" class="nav-item">
                <span class="nav-icon">🏫</span>
                <span class="nav-label">View Rooms</span>
            </button>
            <button onclick="window.location.href='student-view.html'" class="nav-item">
                <span class="nav-icon">👥</span>
                <span class="nav-label">Student List</span>
            </button>
        </nav>

        <a href="../../shared/logout.html" class="nav-item logout-btn">
            <span class="nav-icon">🚪</span>
            <span class="nav-label">Logout</span>
        </a>
    </aside>

    <!-- Expand button (lalabas kapag collapsed) -->
    <button class="sidebar-expand-btn" id="sidebar-expand-btn" title="Expand sidebar">
        <span>▶</span>
    </button>

    <!-- ═══ MAIN CONTENT ═══ -->
    <main class="main-content" id="main-content">
        <div class="timetable-controls">
            <div>
                <h1 id="instructor-title">Instructor: Loading...</h1>
                <p class="subtitle">Personalized matrix extracted from active schedule allocation blocks.</p>
            </div>
            <div class="btn-group">
                <button class="btn-action btn-print" id="print-schedule-btn">🖨️ Print Schedules</button>
                <button class="btn-action btn-pdf" id="download-pdf-btn">📥 Download PDF File</button>
            </div>
        </div>

        <div class="timetable-wrapper card">
            <table class="timetable-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">Time Slot</th>
                        <th style="width: 17%;">Monday</th>
                        <th style="width: 17%;">Tuesday</th>
                        <th style="width: 17%;">Wednesday</th>
                        <th style="width: 17%;">Thursday</th>
                        <th style="width: 17%;">Friday</th>
                    </tr>
                </thead>
                <tbody id="timetable-rows">
                    <!-- Populated dynamically by my-schedule.js -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Vacant Cell Memo Pop-Up Modal -->
    <div class="vacant-modal-overlay" id="vacant-note-modal">
        <div class="vacant-modal-content">
            <h3 id="modal-cell-title">Add Cell Memo</h3>
            <p class="modal-subtitle">Attach a personal reminder or note to this vacant block.</p>
            <textarea id="modal-note-textarea" placeholder="Type your note or memo here..."></textarea>
            <div class="modal-actions-row">
                <button id="modal-cancel-btn">Cancel</button>
                <button id="modal-save-btn">Save Note</button>
            </div>
        </div>
    </div>

    <!-- ═══ Sidebar Toggle Script ═══ -->
    <script>
        (function initSidebarToggle() {
            const sidebar = document.getElementById('app-sidebar');
            const mainContent = document.getElementById('main-content');
            const toggleBtn = document.getElementById('sidebar-toggle');
            const expandBtn = document.getElementById('sidebar-expand-btn');

            const isCollapsed = localStorage.getItem('sidebar-collapsed') === 'true';
            if (isCollapsed) {
                sidebar.classList.add('collapsed');
                mainContent.classList.add('sidebar-collapsed');
                expandBtn.classList.add('visible');
                const icon = toggleBtn.querySelector('.toggle-icon');
                if (icon) icon.textContent = '▶';
            }

            let isAnimating = false;

            function toggleSidebar() {
                if (isAnimating) return;
                isAnimating = true;

                requestAnimationFrame(() => {
                    const nowCollapsed = sidebar.classList.toggle('collapsed');
                    mainContent.classList.toggle('sidebar-collapsed', nowCollapsed);
                    expandBtn.classList.toggle('visible', nowCollapsed);
                    localStorage.setItem('sidebar-collapsed', nowCollapsed);

                    const icon = toggleBtn.querySelector('.toggle-icon');
                    if (icon) icon.textContent = nowCollapsed ? '▶' : '◀';

                    setTimeout(() => { isAnimating = false; }, 350);
                });
            }

            toggleBtn.addEventListener('click', toggleSidebar);
            expandBtn.addEventListener('click', toggleSidebar);
        })();
    </script>

    <script src="../js/my-schedule.js?v=1.1.1"></script>
</body>
</html>
