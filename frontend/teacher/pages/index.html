<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Makiling IS | Teacher Dashboard</title>
    <link rel="icon" type="image/png" href="/auth/makiling_logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Pirata+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/index.css" />
  </head>

  <body>
        <!-- TOP NAVBAR (May Logo at Logout) -->
    <header class="mobile-header" id="mobile-header">
      <!-- Walang hamburger button na kailangan -->
      <div class="mobile-logo">
        <img src="/auth/makiling_logo.png" alt="Logo" width="40" height="40" />
        <div class="logo-text-nav">
            <span class="logo-line-1-nav">Makiling</span>
            <span class="logo-line-2-nav">Integrated School</span>
        </div>
      </div>
      <button type="button" id="mobile-logout-btn" class="mobile-logout" onclick="window.location.href='/auth/logout.html'">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </header>

    <!-- SIDEBAR (Icons Only, Walang Logo) -->
    <aside class="sidebar" id="app-sidebar">
      <!-- Walang logo dito, icons lang -->
      <nav class="nav-links-wrapper" aria-label="Teacher navigation">
        <button type="button" onclick="window.location.href = 'index.html'" class="nav-item active" data-title="Dashboard Home">
          <span class="nav-icon"><i class="fa-solid fa-house"></i></span>
        </button>
        <button type="button" onclick="window.location.href = 'my-schedule.html'" class="nav-item " data-title="My Timetable">
          <span class="nav-icon"><i class="fa-solid fa-calendar-days"></i></span>
        </button>
        <button type="button" onclick="window.location.href = 'rooms-view.html'" class="nav-item" data-title="View Rooms">
          <span class="nav-icon"><i class="fa-solid fa-door-open"></i></span>
        </button>
        <button type="button" onclick="window.location.href = 'student-view.html'" class="nav-item" data-title="Student List">
          <span class="nav-icon"><i class="fa-solid fa-users"></i></span>
        </button>
        <button type="button" onclick="window.location.href = 'profile.html'" class="nav-item" data-title="Profile Settings">
          <span class="nav-icon"><i class="fa-solid fa-gear"></i></span>
        </button>
      </nav>
    </aside>

    <!-- MAIN CONTENT (Walang space sa gilid, centered) -->
    <main class="main-content" id="main-content">
      <header class="welcome-header">
        <div class="welcome-text-block">
          <h1 id="welcome-text">Welcome back, Instructor!</h1>
          <p class="welcome-subtitle">Here's your teaching overview for today.</p>
        </div>
        <div class="welcome-badge" id="welcome-badge" role="status">
          <span class="badge-dot" aria-hidden="true"></span>
          <span id="badge-text">Loading...</span>
        </div>
      </header>

      <section class="today-schedule-card" id="today-schedule-card" aria-labelledby="today-title">
        <div class="today-header">
          <div class="today-header-left">
            <span class="today-icon"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i></span>
            <h2 id="today-title">Today's Schedule</h2>
          </div>
          <span class="today-date" id="today-date"> Loading... </span>
        </div>
        <div class="today-body" id="today-body" aria-live="polite">
          <div class="today-loading">
            <div class="loading-spinner" aria-hidden="true"></div>
            <p>Loading your schedule...</p>
          </div>
        </div>
      </section>

      <section class="dashboard-grid" aria-label="Teaching statistics">
        <div class="stat-card">
          <div class="stat-icon" aria-hidden="true"><i class="fa-solid fa-book-open"></i></div>
          <div class="stat-label">Assigned Classes</div>
          <div id="stat-slots" class="stat-number">--</div>
          <div class="stat-subtext">Periods this week</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" aria-hidden="true"><i class="fa-solid fa-bullseye"></i></div>
          <div class="stat-label">Assigned Subjects</div>
          <div id="stat-subjects" class="stat-number">--</div>
          <div class="stat-subtext">Unique subjects this week</div>
        </div>
      </section>
    </main>

    <script>
      (function initSidebarToggle() {
        const sidebar = document.getElementById("app-sidebar");
        const mainContent = document.getElementById("main-content");
        const mobileNavToggle = document.getElementById('mobile-nav-toggle');
        const backdrop = document.getElementById('sidebar-backdrop');

        if (mobileNavToggle && backdrop) {
            mobileNavToggle.addEventListener('click', () => {
                const isOpen = sidebar.classList.contains('mobile-open');
                if (isOpen) {
                    sidebar.classList.remove('mobile-open');
                    backdrop.classList.remove('active');
                } else {
                    sidebar.classList.add('mobile-open');
                    backdrop.classList.add('active');
                }
            });
            backdrop.addEventListener('click', () => {
                sidebar.classList.remove('mobile-open');
                backdrop.classList.remove('active');
            });
        }
      })();
    </script>

    <script src="/auth/logout.js" defer></script>
    <script src="../js/dashboard-home.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
          try {
              const res = await fetch('/api/teacher/profile', { headers: { 'Content-Type': 'application/json' }, credentials: 'include' });
              if (res.ok) {
                  const profile = await res.json();
                  if (profile.mustChangePassword) window.location.href = '/teacher/pages/profile.html?force=change';
              }
          } catch (e) {}
      });
    </script>
  </body>
</html>
