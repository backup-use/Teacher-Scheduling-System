<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Makiling IS | View Rooms</title>
    <link rel="icon" type="image/png" href="/auth/makiling_logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&family=Pirata+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/rooms-view.css" />
  </head>

  <body>
        <!-- TOP NAVBAR (May Logo at Logout) -->
    <header class="mobile-header" id="mobile-header">
      <!-- Walang hamburger button na kailangan -->
      <div class="mobile-logo">
        <img src="/auth/makiling_logo.png" alt="Logo" width="40" height="40" />
        <div class="logo-text-nav">
            <span class="logo-line-1-nav">Makiling</span>
            <span class="logo-line-2-nav">Integrated School</span>
        </div>
      </div>
      <button type="button" id="mobile-logout-btn" class="mobile-logout" onclick="window.location.href='/auth/logout.html'">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </header>

    <!-- SIDEBAR (Icons Only, Walang Logo) -->
    <aside class="sidebar" id="app-sidebar">
      <!-- Walang logo dito, icons lang -->
      <nav class="nav-links-wrapper" aria-label="Teacher navigation">
        <button type="button" onclick="window.location.href = 'index.html'" class="nav-item" data-title="Dashboard Home">
          <span class="nav-icon"><i class="fa-solid fa-house"></i></span>
        </button>
        <button type="button" onclick="window.location.href = 'my-schedule.html'" class="nav-item " data-title="My Timetable">
          <span class="nav-icon"><i class="fa-solid fa-calendar-days"></i></span>
        </button>
        <button type="button" onclick="window.location.href = 'rooms-view.html'" class="nav-item active" data-title="View Rooms">
          <span class="nav-icon"><i class="fa-solid fa-door-open"></i></span>
        </button>
        <button type="button" onclick="window.location.href = 'student-view.html'" class="nav-item" data-title="Student List">
          <span class="nav-icon"><i class="fa-solid fa-users"></i></span>
        </button>
        <button type="button" onclick="window.location.href = 'profile.html'" class="nav-item" data-title="Profile Settings">
          <span class="nav-icon"><i class="fa-solid fa-gear"></i></span>
        </button>
      </nav>
    </aside>


    <main class="main-content" id="main-content">
      <div class="rooms-header">
        <h1>🏫 School Rooms Directory</h1>
        <p class="subtitle">View available campus spaces, capacities, and designations.</p>
      </div>

      <div class="search-bar-container">
        <input type="text" id="room-search" class="search-input" placeholder="🔍 Search room name or type..." />
      </div>

      <div class="card-glass">
        <table class="rooms-table">
          <thead>
            <tr>
              <th style="width: 40%">Room Name / Number</th>
              <th style="width: 30%">Room Type / Building</th>
              <th style="width: 30%">Seating Capacity</th>
            </tr>
          </thead>
          <tbody id="rooms-rows">
            <tr>
              <td colspan="3" class="loading-state">Loading facilities directory...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <script>
      (function initSidebarToggle() {
        const sidebar = document.getElementById("app-sidebar");
        const mainContent = document.getElementById("main-content");
        const toggleBtn = document.getElementById("sidebar-toggle");
        const expandBtn = document.getElementById("sidebar-expand-btn");
        const mobileNavToggle = document.getElementById('mobile-nav-toggle');
        const backdrop = document.getElementById('sidebar-backdrop');

        if (!sidebar || !mainContent || !toggleBtn || !expandBtn) return;
        const toggleIcon = toggleBtn.querySelector(".toggle-icon");

        let isCollapsed = false;
        try { isCollapsed = localStorage.getItem("sidebar-collapsed") === "true"; } catch (e) {}

        function applySidebarState(collapsed) {
          sidebar.classList.toggle("collapsed", collapsed);
          mainContent.classList.toggle("sidebar-collapsed", collapsed);
          expandBtn.classList.toggle("visible", collapsed);
          toggleBtn.setAttribute("aria-expanded", String(!collapsed));
          expandBtn.setAttribute("aria-expanded", String(collapsed));
          if (toggleIcon) {
            toggleIcon.classList.toggle("fa-chevron-left", !collapsed);
            toggleIcon.classList.toggle("fa-chevron-right", collapsed);
          }
          try { localStorage.setItem("sidebar-collapsed", String(collapsed)); } catch (e) {}
        }

        applySidebarState(isCollapsed);

        let isAnimating = false;
        function toggleSidebar() {
          if (isAnimating) return;
          isAnimating = true;
          isCollapsed = !sidebar.classList.contains("collapsed");
          applySidebarState(isCollapsed);
          window.setTimeout(() => { isAnimating = false; }, 350);
        }

        toggleBtn.addEventListener("click", toggleSidebar);
        expandBtn.addEventListener("click", toggleSidebar);

        if (mobileNavToggle && backdrop) {
            mobileNavToggle.addEventListener('click', () => {
                const isOpen = sidebar.classList.contains('mobile-open');
                if (isOpen) {
                    sidebar.classList.remove('mobile-open');
                    backdrop.classList.remove('active');
                } else {
                    sidebar.classList.add('mobile-open');
                    backdrop.classList.add('active');
                }
            });
            backdrop.addEventListener('click', () => {
                sidebar.classList.remove('mobile-open');
                backdrop.classList.remove('active');
            });
        }
      })();
    </script>

    <script src="/auth/logout.js" defer></script>
    <script src="../js/rooms-view.js"></script>
  </body>
</html>
