<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Makiling IS | View Rooms</title>
    <link rel="icon" type="image/png" href="/auth/makiling_logo.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&family=Pirata+One&display=swap"
      rel="stylesheet"
    />

    <!-- ✅ Font Awesome Free Icons (was missing here before!) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="../css/rooms-view.css" />
  </head>

  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <img
            src="/auth/makiling_logo.png"
            alt="Makiling IS Logo"
            width="40"
            height="40"
          />
          <div class="logo-text">
            <span class="logo-line-1">Makiling</span>
            <span class="logo-line-2">Integrated School</span>
          </div>
        </div>

        <button
          type="button"
          class="sidebar-toggle"
          id="sidebar-toggle"
          title="Collapse sidebar"
          aria-label="Collapse sidebar"
          aria-expanded="true"
          aria-controls="app-sidebar"
        >
          <i
            class="fa-solid fa-chevron-left toggle-icon"
            aria-hidden="true"
          ></i>
        </button>
      </div>

      <!-- TEACHER NAVIGATION -->
      <nav class="nav-links-wrapper" aria-label="Teacher navigation">
        <button
          type="button"
          onclick="window.location.href = 'index.html'"
          class="nav-item"
        >
          <span class="nav-icon">
            <i class="fa-solid fa-house" aria-hidden="true"></i>
          </span>
          <span class="nav-label">Dashboard Home</span>
        </button>

        <button
          type="button"
          onclick="window.location.href = 'my-schedule.html'"
          class="nav-item"
        >
          <span class="nav-icon">
            <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
          </span>
          <span class="nav-label">My Timetable</span>
        </button>

        <!-- ✅ ACTIVE: View Rooms -->
        <button
          type="button"
          onclick="window.location.href = 'rooms-view.html'"
          class="nav-item active"
          aria-current="page"
        >
          <span class="nav-icon">
            <i class="fa-solid fa-door-open" aria-hidden="true"></i>
          </span>
          <span class="nav-label">View Rooms</span>
        </button>

        <button
          type="button"
          onclick="window.location.href = 'student-view.html'"
          class="nav-item"
        >
          <span class="nav-icon">
            <i class="fa-solid fa-users" aria-hidden="true"></i>
          </span>
          <span class="nav-label">Student List</span>
        </button>

        <button
          type="button"
          onclick="window.location.href = 'profile.html'"
          class="nav-item"
        >
          <span class="nav-icon">
            <i class="fa-solid fa-gear" aria-hidden="true"></i>
          </span>
          <span class="nav-label">Profile Settings</span>
        </button>
      </nav>

      <!-- LOGOUT -->
      <button type="button" id="logout-btn" class="nav-item logout-btn">
        <span class="nav-icon">
          <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        </span>
        <span class="nav-label">Logout</span>
      </button>
    </aside>

    <!-- EXPAND SIDEBAR BUTTON -->
    <button
      type="button"
      class="sidebar-expand-btn"
      id="sidebar-expand-btn"
      title="Expand sidebar"
      aria-label="Expand sidebar"
      aria-controls="app-sidebar"
      aria-expanded="false"
    >
      <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
    </button>

    <!-- ═══ MAIN CONTENT ═══ -->
    <main class="main-content" id="main-content">
      <div class="rooms-header">
        <h1>🏫 School Rooms Directory</h1>
        <p class="subtitle">
          View available campus spaces, capacities, and designations.
        </p>
      </div>

      <div class="search-bar-container">
        <input
          type="text"
          id="room-search"
          class="search-input"
          placeholder="🔍 Search room name or type..."
        />
      </div>

      <div class="card-glass">
        <table class="rooms-table">
          <thead>
            <tr>
              <th style="width: 40%">Room Name / Number</th>
              <th style="width: 30%">Room Type / Building</th>
              <th style="width: 30%">Seating Capacity</th>
            </tr>
          </thead>
          <tbody id="rooms-rows">
            <tr>
              <td colspan="3" class="loading-state">
                Loading facilities directory...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- ═══ Sidebar Toggle Script (FIXED: uses class toggling) ═══ -->
    <script>
      (function initSidebarToggle() {
        const sidebar = document.getElementById("app-sidebar");
        const mainContent = document.getElementById("main-content");
        const toggleBtn = document.getElementById("sidebar-toggle");
        const expandBtn = document.getElementById("sidebar-expand-btn");

        if (!sidebar || !mainContent || !toggleBtn || !expandBtn) return;

        const toggleIcon = toggleBtn.querySelector(".toggle-icon");

        let isCollapsed = false;
        try {
          isCollapsed =
            localStorage.getItem("sidebar-collapsed") === "true";
        } catch (e) {
          console.warn("Unable to restore sidebar preference.", e);
        }

        function applySidebarState(collapsed) {
          sidebar.classList.toggle("collapsed", collapsed);
          mainContent.classList.toggle("sidebar-collapsed", collapsed);
          expandBtn.classList.toggle("visible", collapsed);

          toggleBtn.setAttribute("aria-expanded", String(!collapsed));
          expandBtn.setAttribute("aria-expanded", String(collapsed));

          toggleBtn.setAttribute(
            "aria-label",
            collapsed ? "Expand sidebar" : "Collapse sidebar"
          );
          toggleBtn.setAttribute(
            "title",
            collapsed ? "Expand sidebar" : "Collapse sidebar"
          );

          // ✅ FIX: Toggle Font Awesome classes instead of textContent
          if (toggleIcon) {
            toggleIcon.classList.toggle("fa-chevron-left", !collapsed);
            toggleIcon.classList.toggle("fa-chevron-right", collapsed);
          }

          try {
            localStorage.setItem("sidebar-collapsed", String(collapsed));
          } catch (e) {
            console.warn("Unable to save sidebar preference.", e);
          }
        }

        applySidebarState(isCollapsed);

        let isAnimating = false;

        function toggleSidebar() {
          if (isAnimating) return;
          isAnimating = true;

          isCollapsed = !sidebar.classList.contains("collapsed");
          applySidebarState(isCollapsed);

          window.setTimeout(() => {
            isAnimating = false;
          }, 350);
        }

        toggleBtn.addEventListener("click", toggleSidebar);
        expandBtn.addEventListener("click", toggleSidebar);
      })();
    </script>

    <script src="/auth/logout.js" defer></script>
    <script src="../js/rooms-view.js"></script>
  </body>
</html>
