<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makiling IS | Timetable Generation</title>
    <link rel="icon" type="image/png" href="/auth/makiling_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&family=Pirata+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/generate.css">
    <link rel="stylesheet" href="../css/mobile-function.css">
    <!-- PDF Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <!-- ═══ MOBILE MENU BUTTON ═══ -->
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu" type="button">
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- ═══ MOBILE OVERLAY ═══ -->
    <div class="mobile-overlay" id="mobile-overlay"></div>
    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar" id="app-sidebar">
        <div class="sidebar-top">
            <div class="logo">
                <img src="/auth/makiling_logo.png" alt="Makiling IS Logo" width="36" height="36">
                <div class="logo-text">
                    <span class="logo-line-1">Makiling</span>
                    <span class="logo-line-2">Integrated School</span>
                </div>
            </div>
            <button class="sidebar-toggle" id="sidebar-toggle" title="Collapse sidebar">
                <span class="toggle-icon"><i class="fa-solid fa-chevron-left"></i></span>
            </button>
        </div>

        <nav class="nav-links-wrapper">
            <button onclick="window.location.href='Addteacher.html'" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-user-plus"></i></span>
                <span class="nav-label">Teachers</span>
            </button>
            <button onclick="window.location.href='teacher-list.html'" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-list"></i></span>
                <span class="nav-label">Teacher List</span>
            </button>
            <button onclick="window.location.href='subject.html'" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-book"></i></span>
                <span class="nav-label">Manage Subjects</span>
            </button>
            <button onclick="window.location.href='rooms.html'" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-door-open"></i></span>
                <span class="nav-label">Rooms</span>
            </button>
            <button onclick="window.location.href='sections.html'" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-calendar-days"></i></span>
                <span class="nav-label">Sections</span>
            </button>
            <button onclick="window.location.href='generate.html'" class="nav-item active">
                <span class="nav-icon"><i class="fa-solid fa-bolt"></i></span>
                <span class="nav-label">Generate Timetable</span>
            </button>

            <button onclick="window.location.href='profile.html'" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-gear"></i></span>
                <span class="nav-label">Profile Settings</span>
            </button>
        </nav>

        <button type="button" id="logout-btn" class="nav-item logout-btn">
            <span class="nav-icon"><i class="fa-solid fa-right-from-bracket"></i></span>
            <span class="nav-label">Logout</span>
        </button>
    </aside>

    <!-- Expand button -->
    <button class="sidebar-expand-btn" id="sidebar-expand-btn" title="Expand sidebar">
        <span><i class="fa-solid fa-chevron-right"></i></span>
    </button>

    <!-- ═══ MAIN CONTENT ═══ -->
    <main class="main-content" id="main-content">
        <header class="page-head">
            <h1>Generate Timetable</h1>
            <p>Run the scheduling engine and review the results below.</p>
        </header>

        <div class="toolbar" style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: nowrap;">
            <p class="toolbar-text" style="margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                Resolves conflicts across sections, teachers, rooms, and shift availability.
            </p>
            <div style="display: flex; gap: 8px; align-items: center; flex-shrink: 0;">
                <div style="position: relative; display: inline-flex; align-items: center; flex-shrink: 0;">
                    <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; color: #94a3b8; font-size: 0.85rem; pointer-events: none; z-index: 2;"></i>
                    <input
                        type="text"
                        id="section-search-input"
                        placeholder="Search section..."
                        oninput="handleSectionSearch(this.value)"
                        onfocus="showSectionSearchDropdown()"
                        onblur="setTimeout(hideSectionSearchDropdown, 200)"
                        autocomplete="off"
                        style="padding: 10px 12px 10px 36px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; font-family: inherit; width: 220px; max-width: 220px; outline: none; transition: border-color 0.15s ease;"
                        onfocus="this.style.borderColor='#166534'"
                        onblur="this.style.borderColor='#cbd5e1'"
                    >
                    <div
                        id="section-search-dropdown"
                        style="
                            position: absolute;
                            top: calc(100% + 4px);
                            left: 0;
                            right: 0;
                            background: #ffffff;
                            border: 1px solid #cbd5e1;
                            border-radius: 6px;
                            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
                            z-index: 99999;
                            max-height: 280px;
                            overflow-y: auto;
                            display: none;
                            font-family: 'Inter', sans-serif;
                        "
                    ></div>
                </div>
                <button type="button" class="btn-run" onclick="generateNewSchedule()" style="flex-shrink: 0;">
                    <i class="fa-solid fa-play"></i>
                    Generate Schedule
                </button>
            </div>
        </div>

        <h2 class="section-heading">Schedule Output</h2>

        <div id="timetable-matrix-output-body" class="output-body">
            <div class="output-empty">
                No schedule has been generated yet. Click <strong>Generate Schedule</strong> above.
            </div>
        </div>
    </main>

    <!-- ═══ Sidebar Toggle Script ═══ -->
    <script>
        (function initSidebarToggle() {
            const sidebar = document.getElementById('app-sidebar');
            const mainContent = document.getElementById('main-content');
            const toggleBtn = document.getElementById('sidebar-toggle');
            const expandBtn = document.getElementById('sidebar-expand-btn');

            const isCollapsed = localStorage.getItem('sidebar-collapsed') === 'true';
            if (isCollapsed) {
                sidebar.classList.add('collapsed');
                mainContent.classList.add('sidebar-collapsed');
                expandBtn.classList.add('visible');
                const icon = toggleBtn.querySelector('.toggle-icon');
                if (icon) icon.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
            }

            let isAnimating = false;

            function toggleSidebar() {
                if (isAnimating) return;
                isAnimating = true;

                requestAnimationFrame(() => {
                    const nowCollapsed = sidebar.classList.toggle('collapsed');
                    mainContent.classList.toggle('sidebar-collapsed', nowCollapsed);
                    expandBtn.classList.toggle('visible', nowCollapsed);
                    localStorage.setItem('sidebar-collapsed', nowCollapsed);

                    const icon = toggleBtn.querySelector('.toggle-icon');
                    if (icon) icon.innerHTML = nowCollapsed
                        ? '<i class="fa-solid fa-chevron-right"></i>'
                        : '<i class="fa-solid fa-chevron-left"></i>';

                    setTimeout(() => { isAnimating = false; }, 350);
                });
            }

            toggleBtn.addEventListener('click', toggleSidebar);
            expandBtn.addEventListener('click', toggleSidebar);
        })();
    </script>
    <script src="/auth/logout.js" defer></script>
    <script src="../js/generate.js"></script>
    <script src="../js/mobile-function.js"></script>
</body>
</html>
