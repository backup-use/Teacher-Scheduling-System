<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduScheduler Pro | Facilities Management</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/subject.css">
    <link rel="stylesheet" href="../../shared/css/base.css">
    <link rel="stylesheet" href="../css/rooms.css">
</head>
<body>    
        <aside class="sidebar">
            <div class="logo" style="margin-bottom: 3rem; font-size: 1.4rem; font-weight: bold; color: white;">
                🗓️ Scheduler Pro
            </div>
            
            <nav class="nav-links-wrapper">
                <button onclick="window.location.href='Addteacher.html'" class="nav-item " id="btn-teachers">👤 Teachers</button>
                <button onclick="window.location.href='subject.html'" class="nav-item" id="btn-subjects">📚 Manage Subjects</button>
                <button onclick="window.location.href='teacher-list.html'" class="nav-item" id="btn-database">📋 Teacher List</button>
                <button onclick="window.location.href='rooms.html'" class="nav-item active" id="btn-rooms">🏠 Rooms</button>
                <button onclick="window.location.href='sections.html'" class="nav-item" id="btn-schedule">📅 Sections</button>
                <button onclick="window.location.href='generate.html'" class="nav-item" id="btn-generate">⚡ Generate Timetable</button>
            </nav>

            <a href="../../shared/logout.html" class="nav-item logout-btn">
                🚪 Logout
            </a>
        </aside>

        <main class="main-content">
            <header class="content-header" style="margin-bottom: 30px;">
                <div class="header-title-area">
                    <h1 style="color: #ffffff; margin-bottom: 5px;">Facilities Matrix Configuration</h1>
                    <p style="color: #94a3b8; margin: 0;">Register structural classroom spaces and seating constraints below.</p>
                </div>
            </header>

            <div class="dashboard-card-panel">
                <div class="subject-workspace-grid">
                    
                    <div class="subject-panel-col">
                        <div class="form-group">
                            <label class="input-label">Room Designation Name</label>
                            <input type="text" id="room-name" placeholder="e.g., Room 302, Science Lab" class="custom-input-box">
                        </div>
                        <div class="form-group">
                            <label class="input-label">Max Seating Capacity</label>
                            <input type="number" id="room-capacity" placeholder="e.g., 45" class="custom-input-box">
                        </div>
                        <button type="button" class="btn-add-subject" onclick="addNewRoom()">REGISTER ROOM 🏠</button>
                    </div>
                    
                    <div class="subject-panel-col">
                        <label class="input-label" style="display: block; margin-bottom: 8px;">Registered Facilities Catalog</label>
                        <div class="subject-display-box" id="rooms-list">
                            </div>
                    </div>

                </div>
            </div>
        </main>

    <script src="../js/room.js"></script>
    
</body>
</html>
