<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectura | Edit Teacher Info</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='3' width='7' height='7' rx='2' fill='%2300D2FF'/><rect x='3' y='12' width='7' height='9' rx='2' fill='%237C3AED'/><rect x='12' y='14' width='9' height='7' rx='2' fill='%2300D2FF' opacity='0.8'/></svg>">
    <link rel="stylesheet" href="../css/edit-teacher.css">
</head>
<body>

<div class="form-card">
    <h2>✏️ Edit Instructor Profile</h2>
    <form id="editTeacherForm">
        <div class="form-row">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" required>
            </div>
        </div>

        <div class="form-group style-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group style-group">
            <label for="subjects">Subjects</label>
            <input type="text" id="subjects" required>
            <span class="info-note">Separate multiple subjects with commas (e.g., Math, Science, ICT)</span>
        </div>

        <div class="form-group style-group-large">
            <label for="targetGrade">Target Grade</label>
            <input type="text" id="targetGrade" placeholder="e.g., Grade 8">
        </div>

        <div class="availability-section">
            <label class="section-title">Availability Settings</label>
            
            <div class="days-container">
                <label class="day-label"><input type="checkbox" value="Monday" class="day-checkbox"> Mon</label>
                <label class="day-label"><input type="checkbox" value="Tuesday" class="day-checkbox"> Tue</label>
                <label class="day-label"><input type="checkbox" value="Wednesday" class="day-checkbox"> Wed</label>
                <label class="day-label"><input type="checkbox" value="Thursday" class="day-checkbox"> Thu</label>
                <label class="day-label"><input type="checkbox" value="Friday" class="day-checkbox"> Fri</label>
            </div>

            <div style="display: flex; gap: 15px; align-items: center;">
                <div>
                    <select id="startTime" class="time-select" style="padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; width: 140px; font-size: 0.9rem;">
                        <!-- Options will be populated dynamically via JS -->
                    </select>
                </div>

                <span style="color: #a0a0c0; margin-top: 20px;">to</span>
                <label for="startTime" style="display: block; margin-bottom: 5px; color: #a0a0c0; font-size: 0.85rem;">Start Time</label>
            
                <div>
                    <label for="endTime" style="display: block; margin-bottom: 5px; color: #a0a0c0; font-size: 0.85rem;">End Time</label>
                    <select id="endTime" class="time-select" style="padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; width: 140px; font-size: 0.9rem;">
                        <!-- Options will be populated dynamically via JS -->
                    </select>
                </div>
            </div>
        </div>

        <div class="btn-container">
            <a href="teacher-list.html" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-save">Save Changes</button>
        </div>
    </form>
</div>

<script src="../js/edit-teacher.js"></script>
</body>
</html>
