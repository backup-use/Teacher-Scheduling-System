<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectura | Manage Sections</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='3' width='7' height='7' rx='2' fill='%2300D2FF'/><rect x='3' y='12' width='7' height='9' rx='2' fill='%237C3AED'/><rect x='12' y='14' width='9' height='7' rx='2' fill='%2300D2FF' opacity='0.8'/></svg>">
    <link rel="stylesheet" href="../css/sections.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo" style="margin-bottom: 2.5rem; display: flex; align-items: center; gap: 12px; font-size: 1.4rem; font-weight: 700; color: #ffffff;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.4));">
                <rect x="3" y="3" width="7" height="7" rx="2" fill="#00D2FF" />
                <rect x="3" y="12" width="7" height="9" rx="2" fill="#7C3AED" />
                <rect x="12" y="14" width="9" height="7" rx="2" fill="#00D2FF" opacity="0.8" />
            </svg>
            <span>Lectura<span style="color: #00D2FF;">.</span></span>
        </div>
        
        <nav class="nav-links-wrapper">
            <button onclick="window.location.href='Addteacher.html'" class="nav-item" id="btn-teachers">👤 Teachers</button>
            <button onclick="window.location.href='subject.html'" class="nav-item" id="btn-subjects">📚 Manage Subjects</button>
            <button onclick="window.location.href='teacher-list.html'" class="nav-item" id="btn-database">📋 Teacher List</button>
            <button onclick="window.location.href='rooms.html'" class="nav-item" id="btn-rooms">🏠 Rooms</button>
            <button onclick="window.location.href='sections.html'" class="nav-item active" id="btn-schedule">📅 Sections</button>
            <button onclick="window.location.href='generate.html'" class="nav-item" id="btn-generate">⚡ Generate Timetable</button>
        </nav>

        <a href="../../shared/logout.html" class="nav-item logout-btn">🚪 Logout</a>
    </aside>

    <main class="main-content">
        <header class="content-header" style="margin-bottom: 30px;">
            <div class="header-title-area">
                <h1 style="color: #ffffff; margin-bottom: 5px;">Section Management Setup</h1>
                <p style="color: #94a3b8; margin: 0;">Define target class sections and link home rooms to prevent double-booking sections or rooms during schedule synthesis.</p>
            </div>
        </header>

        <div class="dashboard-card-panel">
            <div class="workspace-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                
                <!-- LEFT COLUMN: FORM -->
                <div class="panel-col">
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label class="input-label" style="color: #94a3b8; font-size: 0.9rem; display: block; margin-bottom: 8px;">Section Name</label>
                        <input type="text" id="sectionName" placeholder="e.g., Grade 7 - Sapphire" class="custom-input-box" style="width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 6px; box-sizing: border-box;">
                    </div>

                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label class="input-label" style="color: #94a3b8; font-size: 0.9rem; display: block; margin-bottom: 8px;">Grade Level</label>
                        <select id="sectionGrade" class="custom-input-box" style="width: 100%; background: #1e293b; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px; border-radius: 6px; box-sizing: border-box;">
                            <option value="Grade 7">Grade 7</option>
                            <option value="Grade 8">Grade 8</option>
                            <option value="Grade 9">Grade 9</option>
                            <option value="Grade 10">Grade 10</option>
                            <option value="Grade 11">Grade 11</option>
                            <option value="Grade 12">Grade 12</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label class="input-label" style="color: #94a3b8; font-size: 0.9rem; display: block; margin-bottom: 8px;">Assigned Home Room</label>
                        <select id="assignedRoom" class="custom-input-box" style="width: 100%; background: #1e293b; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px; border-radius: 6px; box-sizing: border-box;">
                            <option value="">Select Room...</option>
                        </select>
                    </div>

                    <button type="button" id="add-section-btn" style="width: 100%; padding: 12px; background: #00d2ff; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase;">SAVE SECTION ➕</button>
                </div>
                
                <!-- RIGHT COLUMN: SECTIONS LIST -->
                <div class="panel-col">
                    <label class="input-label" style="color: #94a3b8; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 10px;">Configured Sections</label>
                    
                    <div style="background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; min-height: 280px; max-height: 450px; overflow-y: auto;">
                        <div id="sections-list-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/sections.js"></script>
</body>
</html>
