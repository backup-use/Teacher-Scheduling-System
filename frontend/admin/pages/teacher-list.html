<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lectura | Teacher Monitor</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='3' width='7' height='7' rx='2' fill='%2300D2FF'/><rect x='3' y='12' width='7' height='9' rx='2' fill='%237C3AED'/><rect x='12' y='14' width='9' height='7' rx='2' fill='%2300D2FF' opacity='0.8'/></svg>">
    <link rel="stylesheet" href="../css/teacher-list.css">
</head>
<body>
    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar" id="app-sidebar">
        <div class="sidebar-top">
            <div class="logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="7" height="7" rx="2" fill="#00D2FF" />
                    <rect x="3" y="12" width="7" height="9" rx="2" fill="#7C3AED" />
                    <rect x="12" y="14" width="9" height="7" rx="2" fill="#00D2FF" opacity="0.8" />
                </svg>
                <span>Lectura<span style="color: #00D2FF;">.</span></span>
            </div>
            <button class="sidebar-toggle" id="sidebar-toggle" title="Collapse sidebar">
                <span class="toggle-icon">◀</span>
            </button>
        </div>

        <nav class="nav-links-wrapper">
            <button onclick="window.location.href='Addteacher.html'" class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Teachers</span>
            </button>
            <button onclick="window.location.href='teacher-list.html'" class="nav-item active">
                <span class="nav-icon">📋</span>
                <span class="nav-label">Teacher List</span>
            </button>
            <button onclick="window.location.href='subject.html'" class="nav-item">
                <span class="nav-icon">📚</span>
                <span class="nav-label">Manage Subjects</span>
            </button>
            <button onclick="window.location.href='rooms.html'" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Rooms</span>
            </button>
            <button onclick="window.location.href='sections.html'" class="nav-item">
                <span class="nav-icon">📅</span>
                <span class="nav-label">Sections</span>
            </button>
            <button onclick="window.location.href='generate.html'" class="nav-item">
                <span class="nav-icon">⚡</span>
                <span class="nav-label">Generate Timetable</span>
            </button>
        </nav>

        <a href="../../shared/logout.html" class="nav-item logout-btn">
            <span class="nav-icon">🚪</span>
            <span class="nav-label">Logout</span>
        </a>
    </aside>

    <!-- Expand button -->
    <button class="sidebar-expand-btn" id="sidebar-expand-btn" title="Expand sidebar">
        <span>▶</span>
    </button>

    <!-- ═══ MAIN CONTENT ═══ -->
    <main class="main-content" id="main-content">
        <header class="page-header">
            <div>
                <h1>Teacher Database</h1>
                <p>Monitor faculty workload and availability settings. Hide retired or inactive teachers instead of deleting them.</p>
            </div>
        </header>

        <!-- ═══ CONTROLS ROW ═══ -->
        <div class="controls-row">
            <div class="tab-group">
                <button id="tab-active" class="tab-btn active" onclick="switchTab('active')">
                    👥 Active Teachers <span id="active-count-badge" class="tab-badge">0</span>
                </button>
                <button id="tab-hidden" class="tab-btn" onclick="switchTab('hidden')">
                    🙈 Hidden Teachers <span id="hidden-count-badge" class="tab-badge hidden-badge">0</span>
                </button>
            </div>

            <div class="search-refresh-group">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input 
                        type="text" 
                        id="teacher-search" 
                        placeholder="Search by name, email, or subject..." 
                        oninput="filterTeachers()"
                    />
                </div>
                <button onclick="loadTeacherData()" class="btn-refresh-glass" title="Refresh Database">
                    <span>🔄</span> Refresh
                </button>
            </div>
        </div>

        <section class="card glass">
            <div class="table-wrapper">
                <table class="teacher-table">
                    <thead>
                        <tr>
                            <th style="width: 20%;">Teacher Name</th>
                            <th style="width: 20%;">Email Address</th>
                            <th style="width: 15%;">Subjects</th>
                            <th style="width: 15%;">Target Grade</th>
                            <th style="width: 15%;">Work Days</th>
                            <th style="width: 10%;">Shift</th>
                            <th style="width: 5%; text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="teacher-table-body">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- ═══ Sidebar Toggle Script ═══ -->
    <script>
        (function initSidebarToggle() {
            const sidebar = document.getElementById('app-sidebar');
            const mainContent = document.getElementById('main-content');
            const toggleBtn = document.getElementById('sidebar-toggle');
            const expandBtn = document.getElementById('sidebar-expand-btn');

            const isCollapsed = localStorage.getItem('sidebar-collapsed') === 'true';
            if (isCollapsed) {
                sidebar.classList.add('collapsed');
                mainContent.classList.add('sidebar-collapsed');
                expandBtn.classList.add('visible');
                const icon = toggleBtn.querySelector('.toggle-icon');
                if (icon) icon.textContent = '▶';
            }

            let isAnimating = false;

            function toggleSidebar() {
                if (isAnimating) return;
                isAnimating = true;

                requestAnimationFrame(() => {
                    const nowCollapsed = sidebar.classList.toggle('collapsed');
                    mainContent.classList.toggle('sidebar-collapsed', nowCollapsed);
                    expandBtn.classList.toggle('visible', nowCollapsed);
                    localStorage.setItem('sidebar-collapsed', nowCollapsed);

                    const icon = toggleBtn.querySelector('.toggle-icon');
                    if (icon) icon.textContent = nowCollapsed ? '▶' : '◀';

                    setTimeout(() => { isAnimating = false; }, 350);
                });
            }

            toggleBtn.addEventListener('click', toggleSidebar);
            expandBtn.addEventListener('click', toggleSidebar);
        })();
    </script>

    <script src="../js/teacher-list.js"></script>
</body>
</html>
