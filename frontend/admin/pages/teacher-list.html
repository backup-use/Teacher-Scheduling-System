<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Monitor | EduScheduler Pro</title>
    <link rel="stylesheet" href="../../shared/css/dashboard.css">
    <link rel="stylesheet" href="../css/teacher-list.css">
</head>
<body>
    
        <aside class="sidebar">
            <div class="logo" style="margin-bottom: 3rem; font-size: 1.4rem; font-weight: bold; color: white;">
                🗓️ Scheduler Pro
            </div>
            
            <nav class="nav-links-wrapper">
                <button onclick="window.location.href='Addteacher.html'" class="nav-item " id="btn-teachers">👤 Teachers</button>
                <button onclick="window.location.href='subject.html'" class="nav-item" id="btn-subjects">📚 Manage Subjects</button>
                <button onclick="window.location.href='teacher-list.html'" class="nav-item active" id="btn-database">📋 Teacher List</button>
                <button onclick="window.location.href='rooms.html'" class="nav-item" id="btn-rooms">🏠 Rooms</button>
                <button onclick="window.location.href='sections.html'" class="nav-item" id="btn-schedule">📅 Sections</button>
                <button onclick="window.location.href='generate.html'" class="nav-item" id="btn-generate">⚡ Generate Timetable</button>
            </nav>

            <a href="../../shared/logout.html" class="nav-item logout-btn">
                🚪 Logout
            </a>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1>Teacher Database</h1>
                    <p>Monitor faculty workload and availability settings.</p>

                    <button onclick="loadTeacherData()" class="btn-refresh-glass" style="margin-bottom: 1rem;">
                        <span>🔄</span> Refresh Database
                    </button>
                </div>
            </header>

            <section class="card glass">
                <div class="table-wrapper">
                    <table class="teacher-table">
                        <thead>
                            <tr>
                                <th style="width: 20%;">Teacher Name</th>
                                <th style="width: 20%;">Email Address</th>
                                <th style="width: 15%;">Subjects</th>
                                <th style="width: 15%;">Target Grade</th>
                                <th style="width: 15%;">Work Days</th>
                                <th style="width: 10%;">Shift</th>
                                <th style="width: 5%; text-align: center;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="teacher-table-body">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

    <script src="../js/teacher-list.js"></script>
</body>
</html>
