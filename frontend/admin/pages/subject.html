<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectura | Master Subject Catalog</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='3' width='7' height='7' rx='2' fill='%2300D2FF'/><rect x='3' y='12' width='7' height='9' rx='2' fill='%237C3AED'/><rect x='12' y='14' width='9' height='7' rx='2' fill='%2300D2FF' opacity='0.8'/></svg>">

    <link rel="stylesheet" href="../css/subject.css">
</head>
<body>
    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar" id="app-sidebar">
        <div class="sidebar-top">
            <div class="logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="7" height="7" rx="2" fill="#00D2FF" />
                    <rect x="3" y="12" width="7" height="9" rx="2" fill="#7C3AED" />
                    <rect x="12" y="14" width="9" height="7" rx="2" fill="#00D2FF" opacity="0.8" />
                </svg>
                <span>Lectura<span style="color: #00D2FF;">.</span></span>
            </div>
            <button class="sidebar-toggle" id="sidebar-toggle" title="Collapse sidebar">
                <span class="toggle-icon">◀</span>
            </button>
        </div>

        <nav class="nav-links-wrapper">
            <button onclick="window.location.href='Addteacher.html'" class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Teachers</span>
            </button>
            <button onclick="window.location.href='teacher-list.html'" class="nav-item">
                <span class="nav-icon">📋</span>
                <span class="nav-label">Teacher List</span>
            </button>
            <button onclick="window.location.href='subject.html'" class="nav-item active">
                <span class="nav-icon">📚</span>
                <span class="nav-label">Manage Subjects</span>
            </button>
            <button onclick="window.location.href='rooms.html'" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Rooms</span>
            </button>
            <button onclick="window.location.href='sections.html'" class="nav-item">
                <span class="nav-icon">📅</span>
                <span class="nav-label">Sections</span>
            </button>
            <button onclick="window.location.href='generate.html'" class="nav-item">
                <span class="nav-icon">⚡</span>
                <span class="nav-label">Generate Timetable</span>
            </button>
        </nav>

        <a href="../../shared/logout.html" class="nav-item logout-btn">
            <span class="nav-icon">🚪</span>
            <span class="nav-label">Logout</span>
        </a>
    </aside>

    <!-- Expand button -->
    <button class="sidebar-expand-btn" id="sidebar-expand-btn" title="Expand sidebar">
        <span>▶</span>
    </button>

    <!-- ═══ MAIN CONTENT ═══ -->
    <main class="main-content" id="main-content">
        <header class="content-header" style="margin-bottom: 30px;">
            <div class="header-title-area">
                <h1 style="color: #ffffff; margin-bottom: 5px;">Master Subject Catalog Setup</h1>
                <p style="color: #94a3b8; margin: 0;">Input the courses offered by the school. The auto-generation algorithm looks at this list and cross-references it with teacher targets to keep schedules fair (*patas*).</p>
            </div>
        </header>

        <div class="dashboard-card-panel">
            <div class="subject-workspace-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                
                <!-- LEFT COLUMN: FORM -->
                <div class="subject-panel-col">
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label class="input-label" style="color: #94a3b8; font-size: 0.9rem; display: block; margin-bottom: 8px;">Subject Title(s)</label>
                        <textarea id="subjectTitle" placeholder="e.g., Mathematics, Science, English, MAPEH (Separate multiple subjects with commas)" class="custom-input-box" style="width: 100%; height: 120px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 6px; resize: vertical; box-sizing: border-box;"></textarea>
                        <small style="color: #00d2ff; font-size: 0.75rem; display: block; margin-top: 6px;">💡 Tip: Separate subjects using commas to batch add in one click.</small>
                    </div>

                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label class="input-label" style="color: #94a3b8; font-size: 0.9rem; display: block; margin-bottom: 8px;">Grade Level Assignment</label>
                        <select id="gradeLevel" class="custom-input-box" style="width: 100%; background: #1e293b; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 10px; border-radius: 6px; box-sizing: border-box;">
                            <option value="Junior High School - Grade 7">Junior High School - Grade 7</option>
                            <option value="Junior High School - Grade 8">Junior High School - Grade 8</option>
                            <option value="Junior High School - Grade 9">Junior High School - Grade 9</option>
                            <option value="Junior High School - Grade 10">Junior High School - Grade 10</option>
                            <option value="Senior High School - Grade 11">Senior High School - Grade 11</option>
                            <option value="Senior High School - Grade 12">Senior High School - Grade 12</option>
                        </select>
                    </div>

                    <button type="button" id="add-subject-btn" class="btn-add-subject" style="width: 100%; padding: 12px; background: #00d2ff; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase;">ADD SUBJECT(S) TO SYSTEM ➕</button>
                </div>
                
                <!-- RIGHT COLUMN: ACTIVE OFFERINGS -->
                <div class="subject-panel-col">
                    <label class="input-label" style="color: #94a3b8; font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 10px;">Subject Lists</label>

                    <!-- BATCH DELETE TOOLBAR -->
                    <div id="batch-delete-bar" style="display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.08);">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll(this)" style="width: 16px; height: 16px; cursor: pointer; accent-color: #ff5f5f;">
                            <label for="select-all-checkbox" style="color: #cbd5e1; font-size: 0.8rem; cursor: pointer; font-weight: 600; user-select: none;">Select All Subjects</label>
                        </div>
                        <button id="btn-delete-checked" onclick="executeBatchDelete()" disabled style="background: rgba(239, 68, 68, 0.2); color: #64748b; border: 1px solid transparent; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 0.78rem; cursor: not-allowed; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease;">
                            🗑️ DELETE CHECKED (<span id="selected-count">0</span>)
                        </button>
                    </div>

                    <!-- SUBJECT LIST CONTAINER -->
                    <div class="subject-display-box" style="background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; min-height: 280px; max-height: 450px; overflow-y: auto;">
                        <div id="subjects-list-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ═══ Sidebar Toggle Script ═══ -->
    <script>
        (function initSidebarToggle() {
            const sidebar = document.getElementById('app-sidebar');
            const mainContent = document.getElementById('main-content');
            const toggleBtn = document.getElementById('sidebar-toggle');
            const expandBtn = document.getElementById('sidebar-expand-btn');

            const isCollapsed = localStorage.getItem('sidebar-collapsed') === 'true';
            if (isCollapsed) {
                sidebar.classList.add('collapsed');
                mainContent.classList.add('sidebar-collapsed');
                expandBtn.classList.add('visible');
                const icon = toggleBtn.querySelector('.toggle-icon');
                if (icon) icon.textContent = '▶';
            }

            let isAnimating = false;

            function toggleSidebar() {
                if (isAnimating) return;
                isAnimating = true;

                requestAnimationFrame(() => {
                    const nowCollapsed = sidebar.classList.toggle('collapsed');
                    mainContent.classList.toggle('sidebar-collapsed', nowCollapsed);
                    expandBtn.classList.toggle('visible', nowCollapsed);
                    localStorage.setItem('sidebar-collapsed', nowCollapsed);

                    const icon = toggleBtn.querySelector('.toggle-icon');
                    if (icon) icon.textContent = nowCollapsed ? '▶' : '◀';

                    setTimeout(() => { isAnimating = false; }, 350);
                });
            }

            toggleBtn.addEventListener('click', toggleSidebar);
            expandBtn.addEventListener('click', toggleSidebar);
        })();
    </script>

    <script src="../js/subject.js"></script>
</body>
</html>
