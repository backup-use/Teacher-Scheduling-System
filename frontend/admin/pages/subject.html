<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makiling IS | Master Subject Catalog</title>
    <link rel="icon" type="image/png" href="/auth/makiling_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&family=Pirata+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/subject.css">
    <link rel="stylesheet" href="../css/mobile-function.css">
    <link rel="stylesheet" href="../css/mobile-function.css">
</head>
<body>
    <!-- ═══ MOBILE MENU BUTTON ═══ -->
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu" type="button">
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- ═══ MOBILE OVERLAY ═══ -->
    <div class="mobile-overlay" id="mobile-overlay"></div>
    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar" id="app-sidebar">
        <div class="sidebar-top">
            <div class="logo">
                <img src="/auth/makiling_logo.png" alt="Makiling IS Logo" width="36" height="36">
                <div class="logo-text">
                    <span class="logo-line-1">Makiling</span>
                    <span class="logo-line-2">Integrated School</span>
                </div>
            </div>
            <button class="sidebar-toggle" id="sidebar-toggle" title="Collapse sidebar">
                <span class="toggle-icon"><i class="fa-solid fa-chevron-left"></i></span>
            </button>
        </div>

        <nav class="nav-links-wrapper">
            <button onclick="window.location.href='Addteacher.html'" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-user-plus"></i></span>
                <span class="nav-label">Teachers</span>
            </button>
            <button onclick="window.location.href='teacher-list.html'" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-list"></i></span>
                <span class="nav-label">Teacher List</span>
            </button>
            <button onclick="window.location.href='subject.html'" class="nav-item active">
                <span class="nav-icon"><i class="fa-solid fa-book"></i></span>
                <span class="nav-label">Manage Subjects</span>
            </button>
            <button onclick="window.location.href='rooms.html'" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-door-open"></i></span>
                <span class="nav-label">Rooms</span>
            </button>
            <button onclick="window.location.href='sections.html'" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-calendar-days"></i></span>
                <span class="nav-label">Sections</span>
            </button>
            <button onclick="window.location.href='generate.html'" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-bolt"></i></span>
                <span class="nav-label">Generate Timetable</span>
            </button>

            <button onclick="window.location.href='profile.html'" class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-gear"></i></span>
                <span class="nav-label">Profile Settings</span>
            </button>
        </nav>

        <button type="button" id="logout-btn" class="nav-item logout-btn">
            <span class="nav-icon"><i class="fa-solid fa-right-from-bracket"></i></span>
            <span class="nav-label">Logout</span>
        </button>
    </aside>

    <!-- Expand button -->
    <button class="sidebar-expand-btn" id="sidebar-expand-btn" title="Expand sidebar">
        <span><i class="fa-solid fa-chevron-right"></i></span>
    </button>

    <!-- ═══ MAIN CONTENT ═══ -->
    <main class="main-content" id="main-content">
        <header class="content-header" style="margin-bottom: 30px;">
            <div class="header-title-area">
                <h1>Master Subject Catalog Setup</h1>
                <p>Input the courses offered by the school. The auto-generation algorithm cross-references this list with teacher targets to keep schedules fair (patas).</p>
            </div>
        </header>

        <div class="dashboard-card-panel">
            <div class="subject-workspace-grid">

                <!-- LEFT COLUMN: FORM -->
                <div class="subject-panel-col">
                    <div class="form-group">
                        <label class="input-label" for="subjectTitle">Subject Title(s)</label>
                        <textarea id="subjectTitle"
                                  placeholder="e.g., Mathematics, Science, English, MAPEH (Separate multiple subjects with commas)"
                                  class="custom-input-box"
                                  style="height: 120px; resize: vertical;"></textarea>
                        <small class="input-hint">
                            <i class="fa-solid fa-lightbulb"></i>
                            Tip: Separate subjects using commas to batch add in one click.
                        </small>
                    </div>

                    <div class="form-group">
                        <label class="input-label" for="gradeLevel">Grade Level Assignment</label>
                        <select id="gradeLevel" class="custom-input-box">
                            <option value="Junior High School - Grade 7">Junior High School - Grade 7</option>
                            <option value="Junior High School - Grade 8">Junior High School - Grade 8</option>
                            <option value="Junior High School - Grade 9">Junior High School - Grade 9</option>
                            <option value="Junior High School - Grade 10">Junior High School - Grade 10</option>
                            <option value="Senior High School - Grade 11">Senior High School - Grade 11</option>
                            <option value="Senior High School - Grade 12">Senior High School - Grade 12</option>
                        </select>
                    </div>

                    <button type="button" id="add-subject-btn" class="btn-add-subject">
                        <i class="fa-solid fa-plus"></i>
                        Add Subject(s) to System
                    </button>
                </div>

                <!-- RIGHT COLUMN: ACTIVE OFFERINGS -->
                <div class="subject-panel-col">
                    <label class="input-label" style="display: block; margin-bottom: 10px;">Subject Lists</label>

                    <!-- BATCH DELETE TOOLBAR -->
                    <div id="batch-delete-bar" class="batch-delete-bar">
                        <div class="batch-delete-left">
                            <input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll(this)">
                            <label for="select-all-checkbox">Select All Subjects</label>
                        </div>
                        <button id="btn-delete-checked" onclick="executeBatchDelete()" disabled class="btn-delete-checked">
                            <i class="fa-solid fa-trash"></i>
                            Delete Checked (<span id="selected-count">0</span>)
                        </button>
                    </div>

                    <!-- SUBJECT LIST CONTAINER -->
                    <div class="subject-display-box">
                        <div id="subjects-list-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ═══ Sidebar Toggle Script ═══ -->
    <script>
        (function initSidebarToggle() {
            const sidebar = document.getElementById('app-sidebar');
            const mainContent = document.getElementById('main-content');
            const toggleBtn = document.getElementById('sidebar-toggle');
            const expandBtn = document.getElementById('sidebar-expand-btn');

            const isCollapsed = localStorage.getItem('sidebar-collapsed') === 'true';
            if (isCollapsed) {
                sidebar.classList.add('collapsed');
                mainContent.classList.add('sidebar-collapsed');
                expandBtn.classList.add('visible');
                const icon = toggleBtn.querySelector('.toggle-icon');
                if (icon) icon.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
            }

            let isAnimating = false;

            function toggleSidebar() {
                if (isAnimating) return;
                isAnimating = true;

                requestAnimationFrame(() => {
                    const nowCollapsed = sidebar.classList.toggle('collapsed');
                    mainContent.classList.toggle('sidebar-collapsed', nowCollapsed);
                    expandBtn.classList.toggle('visible', nowCollapsed);
                    localStorage.setItem('sidebar-collapsed', nowCollapsed);

                    const icon = toggleBtn.querySelector('.toggle-icon');
                    if (icon) icon.innerHTML = nowCollapsed
                        ? '<i class="fa-solid fa-chevron-right"></i>'
                        : '<i class="fa-solid fa-chevron-left"></i>';

                    setTimeout(() => { isAnimating = false; }, 350);
                });
            }

            toggleBtn.addEventListener('click', toggleSidebar);
            expandBtn.addEventListener('click', toggleSidebar);
        })();
    </script>
    <script src="/auth/logout.js" defer></script>
    <script src="../js/subject.js"></script>
    <script src="../js/mobile-function.js"></script>
</body>
</html>
