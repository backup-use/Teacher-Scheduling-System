<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Subjects - Smart Scheduler</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="../css/subject.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo" style="margin-bottom: 3rem; font-size: 1.4rem; font-weight: bold; color: white;">
            🗓️ Scheduler Pro
        </div>
        
        <nav class="nav-links-wrapper">
            <button onclick="window.location.href='Addteacher.html'" class="nav-item " id="btn-teachers">👤 Teachers</button>
            <button onclick="window.location.href='subject.html'" class="nav-item active" id="btn-subjects">📚 Manage Subjects</button>
            <button onclick="window.location.href='teacher-list.html'" class="nav-item" id="btn-database">📋 Teacher List</button>
            <button onclick="window.location.href='rooms.html'" class="nav-item" id="btn-rooms">🏠 Rooms</button>
            <button onclick="window.location.href='sections.html'" class="nav-item" id="btn-schedule">📅 Sections</button>
            <button onclick="window.location.href='generate.html'" class="nav-item" id="btn-generate">⚡ Generate Timetable</button>
        </nav>

        <a href="../../shared/logout.html" class="nav-item logout-btn">
            🚪 Logout
        </a>
    </aside>

    <main class="main-content">
    <div style="background: #151a21; border-radius: 12px; padding: 2.5rem; border: 1px solid rgba(255,255,255,0.05); max-width: 900px; margin: 0 auto;">
        <h2 style="color: #fff; font-size: 1.8rem; margin-top: 0; margin-bottom: 0.5rem;">Master Subject Catalog Setup</h2>
        <p style="color: #a0a0c0; font-size: 0.95rem; margin-bottom: 2rem;">
            Input the courses offered by the school. The auto-generation algorithm looks at this list and cross-references it with teacher targets to keep schedules fair (*patas*).
        </p>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem;">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <label style="color: #a0a0c0; font-size: 0.95rem; font-weight: 500;">New Subject Title</label>
                <input type="text" id="new-subject-name" placeholder="e.g., Computer Science, Calculus" style="background: #0b0c10; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 14px; color: #fff; font-size: 1rem;">
                <button type="button" class="btn-submit" onclick="addNewSubject()" style="background: #00d2ff; color: #0b0c10; border: none; padding: 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem;">
                    ADD SUBJECT TO SYSTEM ➕
                </button>
            </div>
            
            <div>
                <label style="display: block; margin-bottom: 0.5rem; color: #a0a0c0;">Active Institution Offerings</label>
                <div class="catalog-box" id="catalog-list" style="background: #0b0c10; border-radius: 8px; padding: 1.5rem; border: 1px solid rgba(255,255,255,0.05); max-height: 350px; overflow-y: auto;">
                    </div>
            </div>
        </div>
    </div>
</main>
    <script src="../js/subject.js"></script>
</body>
</html>
