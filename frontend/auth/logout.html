<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing Out | Makiling Integrated School</title>
    <link rel="icon" type="image/png" href="/auth/makiling_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f1729 0%, #1a2a1e 50%, #0f1729 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: #e2e8f0;
        }

        .logout-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Loader scene ── */
        .loader-scene {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
        }

        .loader-ring {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-ring-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .loader-ring-track {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 6;
        }

        .loader-ring-progress {
            fill: none;
            stroke: #22c55e;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 276.5;
            stroke-dashoffset: 207;
            transform-origin: 50% 50%;
            animation: ringSpin 1.4s linear infinite;
            filter: drop-shadow(0 0 6px rgba(34, 197, 94, 0.6));
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        .loader-logo {
            position: relative;
            width: 88px;
            height: 88px;
            object-fit: contain;
            z-index: 2;
            animation: logoPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(34, 197, 94, 0.4));
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1);    opacity: 0.9; }
            50%      { transform: scale(1.08); opacity: 1;   }
        }

        .loader-pulse {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.25) 0%, transparent 65%);
            animation: haloPulse 2s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes haloPulse {
            0%, 100% { transform: scale(0.85); opacity: 0.4; }
            50%      { transform: scale(1.15); opacity: 0.9; }
        }

        /* ── Text ── */
        .logout-title {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 8px 0;
            letter-spacing: 0.02em;
        }

        .logout-subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin: 0 0 24px 0;
        }

        .loader-bar {
            width: 220px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .loader-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            border-radius: 3px;
            animation: loadFill 2s ease-out forwards;
        }

        @keyframes loadFill {
            from { width: 0%; }
            to   { width: 100%; }
        }

        .branding {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #475569;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .logout-title { font-size: 1.2rem; }
            .loader-scene { transform: scale(0.85); }
        }

        @media (prefers-reduced-motion: reduce) {
            .loader-ring-progress { animation-duration: 3s; }
            .loader-logo          { animation: none; }
            .loader-pulse         { animation: none; opacity: 0.5; }
            .loader-fill          { animation-duration: 0.1s; }
        }
    </style>
</head>
<body>
    <div class="logout-wrapper">
        <div class="loader-scene">
            <div class="loader-ring">
                <svg viewBox="0 0 100 100" class="loader-ring-svg">
                    <circle class="loader-ring-track" cx="50" cy="50" r="44" />
                    <circle class="loader-ring-progress" cx="50" cy="50" r="44" />
                </svg>
                <img src="/auth/makiling_logo.png" alt="Loading" class="loader-logo">
            </div>
            <div class="loader-pulse"></div>
        </div>

        <h1 class="logout-title">Successfully Logged Out</h1>
        <p class="logout-subtitle">Redirecting you to the login page…</p>

        <div class="loader-bar">
            <div class="loader-fill"></div>
        </div>
    </div>

    <div class="branding">Makiling Integrated School</div>

    <script>
        (async () => {
            try {
                await fetch("/api/auth/logout", {
                    method: "POST",
                    credentials: "include"
                });
            } catch (e) {
                console.error("[logout] API call failed:", e);
            }

            localStorage.removeItem("cached_generated_schedule");
            localStorage.removeItem("cached_teacher_schedules");
            localStorage.removeItem("global_master_schedule");
            localStorage.removeItem("userRole");
            localStorage.removeItem("userName");
            localStorage.removeItem("token");

            setTimeout(() => {
                window.location.href = "/auth/login.html?logout=success";
            }, 2000);
        })();
    </script>
</body>
</html>
