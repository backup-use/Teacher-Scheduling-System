<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lectura | Login</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='3' width='7' height='7' rx='2' fill='%2300D2FF'/><rect x='3' y='12' width='7' height='9' rx='2' fill='%237C3AED'/><rect x='12' y='14' width='9' height='7' rx='2' fill='%2300D2FF' opacity='0.8'/></svg>">
    
  <link rel="stylesheet" href="/shared/css/base.css" />
  <link rel="stylesheet" href="/shared/css/login.css" />
  <style>
    /* ── Forgot Password Link & Modal Styling ── */
    .forgot-link-wrap {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
      margin-bottom: 20px;
    }
    .forgot-link {
      color: #00D2FF;
      font-size: 0.85rem;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .forgot-link:hover {
      opacity: 0.8;
      text-decoration: underline;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 11, 20, 0.8);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: #16192b;
      border: 1px solid rgba(0, 210, 255, 0.2);
      border-radius: 16px;
      padding: 28px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: #ffffff;
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #00D2FF;
      margin-top: 0;
      margin-bottom: 8px;
    }
    .modal-desc {
      font-size: 0.85rem;
      color: #a0a0c0;
      line-height: 1.4;
      margin-bottom: 18px;
    }
    .modal-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #2a2d45;
      background: #0f111a;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
      margin-bottom: 15px;
      outline: none;
    }
    .modal-input:focus {
      border-color: #00D2FF;
      box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 10px;
    }
    .btn-cancel {
      background: transparent;
      border: 1px solid #2a2d45;
      color: #ccc;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-send {
      background: #00D2FF;
      border: none;
      color: #0f111a;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }
    .btn-send:hover {
      background: #33dcfd;
    }
  </style>
</head>
<body>
  <div class="login-bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <main class="login-wrap">
    <div class="login-card">
      
      <div class="logo" style="margin-bottom: 2.5rem; display: flex; align-items: center; gap: 12px; font-size: 1.7rem; font-weight: 700; color: #ffffff;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.4));">
          <rect x="3" y="3" width="7" height="7" rx="3" fill="#00D2FF" />
          <rect x="3" y="12" width="7" height="9" rx="3" fill="#7C3AED" />
          <rect x="12" y="14" width="9" height="7" rx="3" fill="#00D2FF" opacity="0.8" />
        </svg>
        <span>Lectura</span>
      </div>

      <h1 class="login-title">Welcome back</h1>
      <p class="login-sub">Sign in to access your dashboard</p>

      <div id="error-msg" class="error-msg hidden">Invalid username or password</div>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required />
        </div>
        
        <div class="field" style="margin-bottom: 0;">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Forgot Password Link -->
        <div class="forgot-link-wrap">
          <a href="#" id="forgot-pw-btn" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login" id="submit-btn">
          <span id="btn-text">Sign In</span>
          <div id="btn-loader" class="spinner hidden"></div>
        </button>
      </form>

    </div>
  </main>

  <!-- Forgot Password Modal -->
  <div id="forgot-modal" class="modal-overlay">
    <div class="modal-card">
      <h3 class="modal-title">Reset Password</h3>
      <p class="modal-desc">Enter your registered Username or Email address to receive a reset link.</p>

      <!-- Step 1 Field -->
      <input 
        type="text" 
        id="reset-email-input" 
        class="modal-input" 
        placeholder="Username or Email (e.g. admin or teacher@school.edu.ph)" 
        required 
      />

      <!-- Step 2 Fields (Hidden by default) -->
      <div id="missingEmailSection" style="display: none;">
        <p style="font-size: 0.85rem; color: #ffca28; margin-bottom: 12px; line-height: 1.3;">
          ⚠️ No email linked to this account. Provide an email address and the Master Security Key.
        </p>
        
        <input 
          type="email" 
          id="resetTempEmail" 
          class="modal-input" 
          placeholder="Enter your email address" 
        />

        <input 
          type="password" 
          id="resetSecurityKey" 
          class="modal-input" 
          placeholder="Enter Master Security Key" 
        />
      </div>

      <div class="modal-actions">
        <button type="button" id="close-modal-btn" class="btn-cancel">Cancel</button>
        <button type="button" id="send-reset-btn" class="btn-send">Send Link</button>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
  
</body>
</html>
