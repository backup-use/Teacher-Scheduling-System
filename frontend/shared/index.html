<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduScheduler — Login</title>
  <link rel="stylesheet" href="/shared/css/base.css" />
  <link rel="stylesheet" href="/shared/css/login.css" />
</head>
<body>
  <div class="login-bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <main class="login-wrap">
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="8" fill="white" fill-opacity="0.15"/>
            <path d="M7 9h14M7 14h10M7 19h7" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <circle cx="21" cy="19" r="3" fill="#7C3AED"/>
          </svg>
        </div>
        <span class="logo-text">EduScheduler</span>
      </div>

      <h1 class="login-title">Welcome back</h1>
      <p class="login-sub">Sign in to access your dashboard</p>

      <div id="error-msg" class="error-msg hidden">Invalid username or password</div>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="submit-btn">
          <span id="btn-text">Sign In</span>
          <div id="btn-loader" class="spinner hidden"></div>
        </button>
      </form>

      <p class="login-hint">Admin: <code>admin</code> / <code>admin123</code></p>
    </div>
    
  </main>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
